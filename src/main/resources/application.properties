spring.application.name=palmery-payment
server.port=${SERVER_PORT:8082}
auth.jwt-secret=${AUTH_JWT_SECRET:replace-this-secret-with-at-least-32-characters}
auth.allowed-origins=${AUTH_ALLOWED_ORIGINS:http://localhost:3001,http://127.0.0.1:3001}

spring.datasource.url=${SPRING_DATASOURCE_URL:${POSTGRES_URL:jdbc:postgresql://localhost:5432/paymentdb}}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:postgres}}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.h2.console.enabled=${SPRING_H2_CONSOLE_ENABLED:false}
payment.gateway.finish-url=${PAYMENT_GATEWAY_FINISH_URL:http://localhost:3001/payroll}
payment.gateway.midtrans.enabled=${PAYMENT_GATEWAY_MIDTRANS_ENABLED:true}
payment.gateway.midtrans.merchant-id=${PAYMENT_GATEWAY_MIDTRANS_MERCHANT_ID:}
payment.gateway.midtrans.client-key=${PAYMENT_GATEWAY_MIDTRANS_CLIENT_KEY:}
payment.gateway.midtrans.server-key=${PAYMENT_GATEWAY_MIDTRANS_SERVER_KEY:}
payment.gateway.midtrans.snap-base-url=${PAYMENT_GATEWAY_MIDTRANS_SNAP_BASE_URL:https://app.sandbox.midtrans.com/snap/v1/transactions}
payment.gateway.midtrans.api-base-url=${PAYMENT_GATEWAY_MIDTRANS_API_BASE_URL:https://api.sandbox.midtrans.com/v2}

spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:}
spring.data.redis.repositories.enabled=false

app.event.queue=${APP_EVENT_QUEUE:palmery.domain.events}
app.event.listener.enabled=${APP_EVENT_LISTENER_ENABLED:true}
app.event.listener.batch-size=${APP_EVENT_LISTENER_BATCH_SIZE:10}
app.event.listener.max-attempts=${APP_EVENT_LISTENER_MAX_ATTEMPTS:3}
app.event.listener.poll-timeout-ms=${APP_EVENT_LISTENER_POLL_TIMEOUT_MS:250}
