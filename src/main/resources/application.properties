spring.application.name=palmery-payment
server.port=${SERVER_PORT:8082}

spring.datasource.url=${SPRING_DATASOURCE_URL:${POSTGRES_URL:jdbc:postgresql://localhost:5432/paymentdb}}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:postgres}}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.h2.console.enabled=${SPRING_H2_CONSOLE_ENABLED:false}
payment.gateway.webhook-secret=${PAYMENT_GATEWAY_WEBHOOK_SECRET:dev-topup-secret}

spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:guest}
spring.rabbitmq.listener.simple.auto-startup=${BROKER_LISTENER_AUTO_STARTUP:false}
spring.rabbitmq.listener.direct.auto-startup=${BROKER_LISTENER_AUTO_STARTUP:false}
spring.rabbitmq.listener.simple.missing-queues-fatal=false

app.broker.exchange=${APP_BROKER_EXCHANGE:palmery.domain}
app.broker.payment-queue=${APP_BROKER_PAYMENT_QUEUE:palmery.payment.events}
app.broker.payment-routing-key=${APP_BROKER_PAYMENT_ROUTING_KEY:domain.#}
