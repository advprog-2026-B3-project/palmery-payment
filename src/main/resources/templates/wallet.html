<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wallet SawitDollar</title>
    <style>
        :root {
            --bg: #f3f6f3;
            --surface: #ffffff;
            --text: #16371f;
            --muted: #5c6f61;
            --accent: #2f7a4a;
            --line: #d8e2da;
        }

        body {
            margin: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            background: linear-gradient(180deg, #edf5ef 0%, var(--bg) 100%);
            color: var(--text);
        }

        .container {
            max-width: 920px;
            margin: 0 auto;
            padding: 24px 16px 36px;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 18px;
            box-shadow: 0 6px 16px rgba(17, 53, 26, 0.06);
            margin-bottom: 16px;
        }

        .subtitle {
            margin-top: 0;
            margin-bottom: 6px;
            color: var(--muted);
            font-size: 0.9rem;
        }

        .balance {
            margin: 0;
            font-size: 2rem;
            color: var(--accent);
            font-weight: 700;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            text-align: left;
            padding: 10px 8px;
            border-bottom: 1px solid var(--line);
        }

        th {
            color: var(--muted);
            font-weight: 600;
            font-size: 0.9rem;
        }

        .empty {
            color: var(--muted);
            margin: 0;
        }
    </style>
</head>
<body>
<main class="container">
    <section class="card">
        <p class="subtitle" th:text="'User: ' + ${wallet.userId}">User: user-1</p>
        <h1 class="balance" th:text="'SawitDollar ' + ${wallet.balance}">SawitDollar 0.00</h1>
    </section>

    <section class="card">
        <h2>Riwayat Payroll</h2>

        <div th:if="${#lists.isEmpty(wallet.payrollHistory)}">
            <p class="empty">Belum ada riwayat payroll.</p>
        </div>

        <table th:unless="${#lists.isEmpty(wallet.payrollHistory)}">
            <thead>
            <tr>
                <th>Waktu</th>
                <th>Deskripsi</th>
                <th>Nominal (SawitDollar)</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="item : ${wallet.payrollHistory}">
                <td th:text="${item.paidAt}">2026-01-01T00:00:00Z</td>
                <td th:text="${item.description}">Payroll bulan Januari</td>
                <td th:text="${item.amount}">1500.00</td>
            </tr>
            </tbody>
        </table>
    </section>
</main>
</body>
</html>
